<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCE TV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
</head>

<body>
    <div class="container">
        <h1>
            <a
                class="static-link"
                href="cache.html"
            >
                SCE TV
            </a>
        </h1>
        <div class="now-playing animated" style="display: none;">
            <h3 id="now-playing-title" hidden>now playing:</h3>
            <h2 id="video-title" class="title-header" hidden></h2>
            <img id="video-thumbnail" class="thumbnail-img" hidden>
            <div class="button-container">
                <button id="stop" hidden>stop!</button>
            </div>
        </div>
        <div class="enter-url">
            <input id="url" placeholder="enter youtube url" />
            <div class="button-container">
                <button id="get-video-seconds" hidden>play video from certain point!</button>
                <button id="loop-video" hidden>loop video?</button>
                <p id="video-in-playlist-prompt" hidden>
                    note: this video is part of a playlist. SCE TV will
                    only consider videos between this video and the
                    end of the playlist as the "playlist."
                </p>
                <button id="submit" hidden>go</button>
            </div>
            <br>
            <p id="humanized-start-time"></p>
            <input id="start-offset-seconds" type="range" hidden />
            <input id="last-requested-duration-url" type="text" hidden />
            <input id="was-metadata-requested" type="checkbox" hidden />
            <input id="is-playlist" type="checkbox" hidden />
            <input id="loop-video" type="checkbox" hidden />
            <div class="preview-video animated">
                <h2 id="preview-video-title" class="title-header" hidden>the video</h2>
                <img id="preview-video-thumbnail" class="thumbnail-img" hidden>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
