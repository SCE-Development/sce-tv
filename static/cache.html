<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCE TV: Static Content Edition</title>
    <style>
        .entry {
            display: flex;
            justify-content: space-between;
            max-width: 50em;
            border: 0.5px dashed gainsboro;
            height: 58px;
        }
        .entry > p {
            word-break: break-all;
        }
        .btn-group > button {
            height: 100%;
            width: 53px;
        }
    </style>
</head>

<body>
    <button id="scetv-btn">back to sce tv</button>
    <button id="cache-btn">view disk cache</button>
    <button id="home-btn">go to top directory</button>
    <button id="back-btn">↩ go back</button>
    <h2 id="path-title"></h2>
    <button id="play-dir-btn">play entire directory</button>
    <div id="country"></div>
    <script>
        const stream = window.location.host.split('.')[0];
        let parent = null;

        const urlSearchParams = new URLSearchParams(window.location.search);
        const params = Object.fromEntries(urlSearchParams.entries());

        function playVideo(path, loop=false, name=null, thumbnail=null) {
            const url = new URL('file/play', window.location.href);
            fetch(url.href, {
                method: 'POST',
                body: JSON.stringify({
                    path,
                    loop,
                    stream,
                    title: name || path,
                    thumbnail,
                })
            });
        }

        function deleteVideo(videoId, videoName) {
            if (!confirm(`Delete "${videoName}"?`)) {
                return;
            }
            const url = new URL('api/cache/delete', window.location.href);
            fetch(url.href, {
                method: 'POST',
                body: JSON.stringify({
                    id: videoId,
                })
            });
        }

        function backToSceTv() {
            let url = window.location.href;
            window.location.href = window.location.href.substring(0, url.lastIndexOf('/'));
        }

        function goToCachePage() {
            const placeToGo = window.location.href.split('?')[0] + '?path=cache';
            window.location.href = placeToGo;
        }

        function goHome(path = '') {
            if (path) {
                window.location.href = window.location.href.split('?')[0] + '?path=' + path;
                return;
            }
            window.location.href = window.location.href.split('?')[0];
        }

        function maybeRenderThumbnail(item={}) {
            if (!item.thumbnail) {
                return ''
            }
            return `<img src="${item.thumbnail}" width="100">`
        }

        function maybeRenderThumbnailAndTitleAttributes(item={}) {
            let result = '';
            if (item.thumbnail) {
                result += ` data-thumbnail="${item.thumbnail}"`;
            }
            if (item.name) {
                result += ` data-name="${item.name}"`;
            }
            return result;
        }

        function maybeRenderDeleteButton(videoId, videoName) {
            if (
                params.delete &&
                params.path === 'cache' &&
                videoId
            ) {
                return `
                    <button
                        data-name="${videoName}"
                        value=${videoId}
                        class="delete-btn"
                    >
                        Delete
                    </button>`;
            }
            return '';
        }

        fetch(`file/list${params.path ? '?path=' + params.path : ''}`)
            .then(x => x.json())
            .then((result) => {
                const urlParams = new URLSearchParams(window.location.search);
                const path = urlParams.get('path') || '';
                const slashCount = (path.match(/\//g) || []).length;
                console.log({path, slashCount})
                const parentButton = document.getElementById('back-btn');
                if (slashCount) {
                    const parent = path.substring(0, path.lastIndexOf('/'));
                    parentButton.removeAttribute('hidden');
                    parentButton.addEventListener('click', () => goHome(parent));
                } else {
                    parentButton.setAttribute('hidden', 'true');
                }
                let output = '';
                document.getElementById('path-title').textContent = params.path;
                result.forEach(function (item) {
                    if (item.is_directory) {
                        const placeToGo = window.location.href.split('?')[0] + '?path=' + encodeURIComponent(item.path);
                        output += `
                        <div class="entry">
                            <a href=${placeToGo}>
                                <p>${item.name}/</p>
                            </a>
                        </div>
                        `
                    } else {
                        output += `
                        <div class="entry">
                            ${maybeRenderThumbnail(item)}
                            <p>${item.name}</p>
                            <div class="btn-group">
                                <button
                                    class="play-btn"
                                    ${maybeRenderThumbnailAndTitleAttributes(item)}
                                    value="${item.path}""
                                >
                                    play
                                </button>
                                ${maybeRenderDeleteButton(item.id, item.name)}
                            </div>
                        </div>
                        `
                    }
                })
                document.getElementById('country').innerHTML = output;
                const maybePlayButtons = document.getElementsByClassName('play-btn');
                const maybeDeleteButtons = document.getElementsByClassName('delete-btn');
                if (maybePlayButtons) {
                    for (var i = 0; i < maybePlayButtons.length; i++) {
                        maybePlayButtons[i].addEventListener(
                            'click',
                            (e) => playVideo(
                                e.target.value,
                                false,
                                e.target.dataset.name,
                                e.target.dataset.thumbnail,
                            ),
                            false,
                        );
                    }
                }
                if (maybeDeleteButtons) {
                    for (var i = 0; i < maybeDeleteButtons.length; i++) {
                        maybeDeleteButtons[i].addEventListener(
                            'click',
                            (e) => deleteVideo(e.target.value, e.target.dataset.name,),
                            false,
                        );
                    }
                }
            })
            .catch(err => console.error(err));
        if (!params.path) {
            document.getElementById('home-btn').setAttribute('hidden', 'true');
            document.getElementById('scetv-btn').removeAttribute('hidden');
            document.getElementById('cache-btn').removeAttribute('hidden');
        } else {
            document.getElementById('home-btn').removeAttribute('hidden');
            document.getElementById('scetv-btn').setAttribute('hidden', 'true');
            document.getElementById('cache-btn').setAttribute('hidden', 'true');
        }
        document.getElementById('play-dir-btn').addEventListener('click', () => playVideo(params.path, true), false);
        document.getElementById('home-btn').addEventListener('click', () => goHome());
        document.getElementById('scetv-btn').addEventListener('click', backToSceTv);
        document.getElementById('cache-btn').addEventListener('click', goToCachePage);
    </script>
</body>

</html>
