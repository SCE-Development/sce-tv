version: '2'
services:
  streaming-server:
    image: 'illuspas/node-media-server'
    container_name: nms
    restart: always
    ports:
      - '1935:1935'
      - '8000:8000'
  gyat-server:
    container_name: gyat_server
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: 'on-failure'
    command:
      - --interlude-file-path=/tmp/videos/interlude.mp4
      - --download-file-location=/tmp/videos
      - --rtmp-stream-url=rtmp://nms/live/mystream
      - --cache-state-file=/tmp/videos/state.json
      - --port=5001
    volumes:
      - ./server.py:/app/server.py
      - ./static/:/app/static/
      - ./modules:/app/modules
      - ./videos:/tmp/videos:rw

networks: 
  default:
    external: 
      name: poweredge
